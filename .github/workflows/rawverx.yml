name: Test rawverx module and trigger pkg.go.dev update

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test version ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        go-version:
          - "1.19"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test module
        run: |
          mkdir .build
          go test -vet=all -coverprofile=.build/rawverx-${{ github.ref_name }}-coverage.go-${{ matrix.go-version }}.out ./...

      - name: Upload coverage profiles
        uses: ariaci/gha-upload-artifact@v1
        with:
          name: coverage.go-${{ matrix.go-version }}
          path: |
            .build/rawverx-${{ github.ref_name }}-coverage.go-${{ matrix.go-version }}.out

  release:
    name: Create Release
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: ariaci/gha-make-release@v1

  update-pkg-go-dev:
    name: Update pkg.go.dev
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Update pkg.go.dev
        uses: ariaci/gha-update-pkg-go-dev@v1
        with:
          module: github.com/ariaci/rawverx
          version: ${{ github.ref_name }}
