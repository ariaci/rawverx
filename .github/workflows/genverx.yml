name: Test genverx module and trigger pkg.go.dev update

on:
  workflow_dispatch:
  push:
    tags:
      - "genverx/v*"

jobs:
  test:
    name: Test version ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        go-version:
          - "1.25"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Determine version
        run: |
          echo "GENVERX_VERSION=${GITHUB_REF_NAME#genverx/}" >> "$GITHUB_ENV"
      - name: Determine coverage file basename
        run: |
          echo "COVERAGE_FILE=.build/genverx-${{ env.GENVERX_VERSION }}-coverage.go-${{ matrix.go-version }}" >> "$GITHUB_ENV"

      - name: Test module
        run: |
          mkdir .build
          cd genverx
          go test -vet=all -coverprofile='../${{ env.COVERAGE_FILE }}.out' ./...
          go tool cover -html='../${{ env.COVERAGE_FILE }}.out' -o '../${{ env.COVERAGE_FILE }}.html'

      - name: Upload coverage profiles
        uses: ariaci/gha-upload-artifact@v1
        with:
          name: coverage.go-${{ matrix.go-version }}
          path: |
            ${{ env.COVERAGE_FILE }}.out
            ${{ env.COVERAGE_FILE }}.html

  release:
    name: Create Release
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: ariaci/gha-make-release@v1

  update-pkg-go-dev:
    name: Update pkg.go.dev
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Determine version
        run: |
          echo "GENVERX_VERSION=${GITHUB_REF_NAME#genverx/}" >> "$GITHUB_ENV"
      - name: Update pkg.go.dev
        uses: ariaci/gha-update-pkg-go-dev@v1
        with:
          module: github.com/ariaci/rawverx/genverx
          version: ${{ env.GENVERX_VERSION }}
